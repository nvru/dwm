
[colors]
background = #000000
; background = #88000000
background-alt = #373B41
foreground = #C5C8C6
primary = #ffffff
secondary = #8ABEB7
alert = #A54242
disabled = #707880

[bar/example]
width = 100%
height = 20pt
radius = 0

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 4pt

border-size = 0pt
border-color = #000000

padding-left = 0
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = JetBrains Mono Nerd Font:style=bold:size=8;2
font-1 = Iosevka Nerd Font,Iosevka NF:style=Bold:size=8.5;2
font-2 = DejaVu Sans:style=bold:size=8;2
font-3 = Hack Nerd Font Mono:pixelsize=11:antialias=true:autohint=true
font-4 = Sans CJK JP:pixelsize=11:antialias=true:autohint=true
font-5 = Liberation Mono:pixelsize=11:antialias=true:autohint=true
font-6 = Inconsolata for Powerline:pixelsize=11:antialias=true:autohint=true

modules-left = ewmh xwindow
modules-center = date
modules-right = battery filesystem  memory cpu systray

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

[module/systray]
type = internal/tray

format-margin = 4pt
tray-spacing = 4pt

[module/ewmh]
type = internal/xworkspaces

pin-workspaces = false
group-by-monitor = false
enable-click = true
enable-scroll = true

format = <label-state>

label-monitor = %name%

label-active = %name%
label-active-foreground = ${colors.primary}
label-active-underlind = ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-foreground = ${colors.disabled}
label-occupied-padding = 1

label-urgent = %name%
label-urgent-foreground = #000000
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = #55
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:100:...%

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${colors.primary}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/battery]
type = internal/battery

battery = BAT1
adapter = ACAD

format-charging = <label-charging>
format-discharging = <label-discharging>
format-full = <label-full>

format-charging-prefix = "BAT (+)"
format-discharging-prefix = "BAT (-)"
format-full-prefix = "BAT"

format-charging-prefix-foreground = ${colors.primary}
format-discharging-prefix-foreground = ${colors.primary}
format-full-prefix-foreground = ${colors.primary}

label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%

label-charging-background = ${colorsprimary}
label-discharging-background = ${colorsprimary}
label-full-background = ${colorsprimary}

label-charging-padding = 1
label-discharging-padding = 1
label-full-padding = 1

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

label-mounted = %{F#ffffff}%mountpoint%%{F-} %percentage_used%%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = muted
label-muted-foreground = ${colors.disabled}

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#bb9af7}%ifname%%{F#707880} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#7aa2f7}%ifname%%{F-} %essid% %local_ip%

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#ffffff}%ifname%%{F-} %local_ip%

[module/date]
type = internal/date
interval = 1

date = %b %d (%a) %I:%M:%S %p
date-alt = %Y-%m-%d %H:%M:%S

label = %{F#ffffff}󰸘%{F-} %date%
label-foreground = ${colors.primary}


[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
